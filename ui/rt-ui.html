<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faust RT UI</title>
  <link rel="stylesheet" href="/faust-ui/index.css" />
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    .page {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      padding: 20px 24px;
    }
    h1 { margin-bottom: 8px; text-align: center; }
    .status { color: #444; margin-bottom: 16px; display: none; text-align: center; }
    .param { margin: 10px 0; }
    .param label { display: block; font-size: 13px; color: #333; }
    .param input[type=range] { width: 320px; }
    .param .value { display: inline-block; min-width: 60px; text-align: right; }
    #fallback-ui { text-align: center; }
    #fallback-ui .param { display: inline-block; text-align: left; margin: 10px 12px; }
    #faust-ui-container {
      margin-top: 16px;
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      display: flex;
      border-radius: 6px;
    }
    #faust-ui-root {
      position: absolute;
      inset: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    #dsp-name { font-weight: 600; margin-top: 4px; text-align: center; }
    #midi-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
      font-size: 13px;
    }
    #midi-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }
    #midi-panel select { min-width: 220px; }
    #midi-status { color: #666; }
    #poly-active { color: #666; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Faust Real-time UI</h1>
    <div class="status" id="status">Loading...</div>
    <div id="dsp-name"></div>
    <div id="midi-panel">
      <div id="midi-row">
        <label for="midi-select">MIDI input</label>
        <select id="midi-select">
          <option value="">Loading…</option>
        </select>
        <span id="midi-status"></span>
      </div>
      <span id="poly-active"></span>
    </div>
    <div id="faust-ui-container">
      <div id="faust-ui-root"></div>
    </div>
    <div id="fallback-ui"></div>
  </div>

  <script type="module" src="/rt-ui.js"></script>
</body>
</html>
